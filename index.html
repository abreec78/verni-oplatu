<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142c3c"><link rel="manifest" href="./manifest.webmanifest"><title>Верни оплату</title><style>body{margin:0;background:#f3f6fa;color:#142c3c;font:16px system-ui}main{max-width:760px;margin:auto;padding:20px}h1{font-size:26px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #1232}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{font-size:28px;font-weight:700}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #c9d3df;font:inherit}button{background:#146c7d;color:white;border:0;cursor:pointer}button.alt{background:#e7eff2;color:#164454}button.del{background:#fff0f0;color:#9a2730}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}small,label{color:#617483}label{display:block;font-size:13px}label input{margin-top:5px}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>💸 Верни оплату</h1><small>Учёт оплат · тестовая версия</small><div class="grid"><div class="card"><small>Ожидается</small><div class="stat" id="total">0 ₽</div></div><div class="card"><small>Просрочено</small><div class="stat" id="late">0 ₽</div></div></div><section class="card"><h2>Новая оплата</h2><form id="form" class="grid"><label>Клиент<input id="name" required maxlength="80" placeholder="Алексей"></label><label>Услуга<input id="service" required maxlength="120" placeholder="Ремонт ноутбука"></label><label>Сумма, ₽<input id="amount" required type="number" min="1" max="100000000" step=".01"></label><label>Срок оплаты<input id="due" required type="date"></label><button>Добавить оплату</button></form></section><h2>Клиенты и оплаты</h2><div id="list"></div><p id="empty">Пока записей нет.</p><small>Данные сохраняются только в этом браузере. Нет аккаунтов, синхронизации, резервных копий и автоматической отправки. Для проверки используйте вымышленные данные.</small></main><script>
const key='verni-oplatu-v1';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(items))items=[]}catch{items=[]}
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(n),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};$('due').value=today();
function save(){localStorage.setItem(key,JSON.stringify(items));render()}
function render(){const open=items.filter(x=>!x.paid),late=open.filter(x=>x.due<today());$('total').textContent=money(open.reduce((s,x)=>s+x.amount,0));$('late').textContent=money(late.reduce((s,x)=>s+x.amount,0));$('empty').hidden=items.length>0;const list=$('list');list.replaceChildren();for(const item of [...items].sort((a,b)=>Number(a.paid)-Number(b.paid)||a.due.localeCompare(b.due))){const box=document.createElement('div');box.className='card';const title=document.createElement('strong');title.textContent=item.name+' · '+money(item.amount);const desc=document.createElement('p');desc.textContent=item.service+' · Срок: '+item.due+(item.paid?' · Оплачено':item.due<today()?' · ПРОСРОЧЕНО':' · Ожидается');const actions=document.createElement('div');actions.className='actions';const remind=document.createElement('button');remind.className='alt';remind.textContent='Скопировать напоминание';remind.disabled=item.paid;remind.onclick=async()=>{const msg='Здравствуйте, '+item.name+'! Напоминаю об оплате услуги «'+item.service+'» на сумму '+money(item.amount)+'. Срок оплаты: '+item.due+'. Подскажите, пожалуйста, когда сможете оплатить?';try{await navigator.clipboard.writeText(msg);alert('Напоминание скопировано')}catch{prompt('Скопируйте сообщение:',msg)}};const paid=document.createElement('button');paid.textContent=item.paid?'Отменить оплату':'Оплачено';paid.onclick=()=>{item.paid=!item.paid;save()};const del=document.createElement('button');del.className='del';del.textContent='Удалить';del.onclick=()=>{if(confirm('Удалить запись?')){items=items.filter(x=>x.id!==item.id);save()}};actions.append(remind,paid,del);box.append(title,desc,actions);list.append(box)}}
$('form').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;items.push({id:crypto.randomUUID(),name:$('name').value.trim(),service:$('service').value.trim(),amount,due:$('due').value,paid:false});save();$('form').reset();$('due').value=today()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
